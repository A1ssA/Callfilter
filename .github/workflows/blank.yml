name: Build CallGuard APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          if [ -f "CallGuard-Android.zip" ] && [ ! -f "settings.gradle.kts" ] && [ ! -f "CallGuard-Android/settings.gradle.kts" ]; then
            unzip -o CallGuard-Android.zip
          fi
          if [ -f "CallGuard-Android/settings.gradle.kts" ]; then
            cd CallGuard-Android
          fi
          gradle assembleDebug --no-daemon

      - name: Upload CallGuard APK
        uses: actions/upload-artifact@v4
        with:
          name: CallGuard-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
